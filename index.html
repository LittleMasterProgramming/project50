/* Custom Scrollbar */
::-webkit-scrollbar {
  width: 6px;
  height: 6px;
}
::-webkit-scrollbar-track {
  background: #0f131c;
}
::-webkit-scrollbar-thumb {
  background: #262a33;
  border-radius: 9999px;
}
::-webkit-scrollbar-thumb:hover {
  background: #3b494c;
}

/* Leaflet Dark Customizations */
.leaflet-container {
  background: #0a0e16 !important;
  font-family: 'Inter', sans-serif !important;
}

/* Leaflet tiles fine-tuning */
.leaflet-tile-pane {
  filter: contrast(1.05) brightness(0.95);
}

.material-symbols-outlined {
  font-family: 'Material Symbols Outlined', sans-serif;
  font-weight: normal;
  font-style: normal;
  font-size: 20px;
  line-height: 1;
  letter-spacing: normal;
  text-transform: none;
  display: inline-block;
  white-space: nowrap;
  word-wrap: normal;
  direction: ltr;
  -webkit-font-smoothing: antialiased;
}

.leaflet-popup-content-wrapper {
  background: rgba(28, 32, 40, 0.95) !important;
  backdrop-filter: blur(16px) !important;
  -webkit-backdrop-filter: blur(16px) !important;
  color: #dfe2ee !important;
  border: 1px solid rgba(0, 229, 255, 0.35) !important;
  border-radius: 14px !important;
  box-shadow: 0 16px 36px -4px rgba(3, 7, 18, 0.9) !important;
  padding: 2px !important;
}

.leaflet-popup-tip {
  background: #1c2028 !important;
  border: 1px solid rgba(0, 229, 255, 0.2) !important;
}

.leaflet-popup-content {
  margin: 12px 14px !important;
  line-height: 1.4 !important;
}

.leaflet-popup-close-button {
  color: #bac9cc !important;
  padding: 6px !important;
}
.leaflet-popup-close-button:hover {
  color: #00e5ff !important;
}

/* Radar ping animation */
@keyframes pulse-ring {
  0% {
    transform: scale(0.85);
    opacity: 0.9;
  }
  50% {
    transform: scale(1.6);
    opacity: 0.2;
  }
  100% {
    transform: scale(2.2);
    opacity: 0;
  }
}

.radar-ping {
  animation: pulse-ring 2.4s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
}

/* Range input thumb styling */
input[type="range"]::-webkit-slider-thumb {
  transition: transform 0.1s ease, box-shadow 0.1s ease;
}
input[type="range"]::-webkit-slider-thumb:hover {
  transform: scale(1.2);
}

html,body,#root{min-height:100%;margin:0;background:#0f131c;color:#dfe2ee;font-family:Inter,sans-serif}
.leaflet-container{height:100%;width:100%;}
